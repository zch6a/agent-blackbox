<!doctype html>
<!-- The repository's social preview (1280×640), rendered with headless Chrome into docs/social-preview.png. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { background: radial-gradient(1100px 700px at 10% 0%, #10283d 0%, #111418 55%, #0c0e11 100%); color: #e9edf1;
    font-family: "Segoe UI", -apple-system, system-ui, sans-serif; display: grid; grid-template-columns: 470px 1fr; gap: 34px; padding: 66px 0 0 66px; box-sizing: border-box; }
  h1 { font-size: 66px; margin: 0 0 16px; letter-spacing: -1.5px; line-height: 1.02; }
  h1 span { color: #58a6ff; }
  .tag { font-size: 30px; line-height: 1.25; margin: 0 0 22px; font-weight: 600; }
  .sub { font-size: 19px; line-height: 1.5; color: #b6bec8; margin: 0 0 28px; }
  .cmd { font: 20px Consolas, ui-monospace, monospace; background: #1a1f26; border: 1px solid #2f3742; border-radius: 10px; padding: 12px 16px; display: inline-block; color: #fff; }
  .cmd b { color: #7ee787; font-weight: 400; }
  .shot { align-self: start; width: 760px; border-radius: 14px 0 0 0; border: 1px solid #2b333d; border-right: 0; border-bottom: 0; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
</style>
</head>
<body>
  <div>
    <h1>agent<span>-</span><br>blackbox</h1>
    <p class="tag">A flight recorder for<br>AI coding agents.</p>
    <p class="sub">Replay every Claude Code, Codex, OpenCode and DeepSeek Harness session: prompts, tool calls, diffs, errors, tokens and dollars. Local only.</p>
    <div class="cmd"><b>$</b> npx github:zch6a/agent-blackbox</div>
  </div>
  <img class="shot" src="../docs/screenshot-session.png" alt="">
</body>
</html>
